<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AstonCyber — Coming Soon</title>
  <!-- Favicons -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon-180x180.png">
  <meta name="description" content="AstonCyber — Modern cloud & cybersecurity. Site launching soon." />
  <style>
    :root{
      --bg:#0b0b0b;                  /* near-black */
      --gold:#C89B3C;                /* subdued golden */
      --text:#eaeaea;                /* light text */
      --muted:#b6b6b6;
    }
    *{box-sizing:border-box; margin:0; padding:0}
    html,body{height:100%}
    body{
      font-family:"Neue Haas Grotesk Text","Helvetica Neue",Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica",Arial,sans-serif; 
      background:var(--bg);
      color:var(--text);
      display:flex; align-items:center; justify-content:center;
      min-height:100vh;
      text-align:center;
      padding:clamp(12px, 4vw, 48px);
    }
    .wrap{max-width:960px; width:100%}
    .logo-img {
      width: clamp(160px, 45vw, 520px); /* responsive scaling */
      height: auto;
      margin: 0 auto clamp(10px, 3vh, 22px);
      max-width: 92vw;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,.6));
    }
    .tag{
      font-size: clamp(16px, 2.8vw, 24px);
      color:var(--muted);
      margin-bottom: clamp(14px, 2.5vh, 22px);
      line-height: 1.4;
    }
    footer{
      margin-top: clamp(18px, 3vh, 26px);
      font-size: clamp(12px, 1.8vw, 16px);
      color:var(--muted);
    }
    a{color:var(--gold); text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="wrap">
    <!-- Display logo with responsive scaling -->
    <img src="assets/astoncyber-logo-white.png" alt="AstonCyber logo" class="logo-img" />
    <div class="tag">Modern Cloud & Cybersecurity Solution — site launching soon.</div>
    <footer>
      © <span id="y"></span> AstonCyber · <a href="mailto:info@astoncyber.com">info@astoncyber.com</a>
    </footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
