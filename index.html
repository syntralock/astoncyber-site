<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AstonCyber — Coming Soon</title>
  <meta name="description" content="AstonCyber — Modern cloud & cybersecurity solution. Site launching soon." />
  <style>
    :root{
      --bg:#0b0b0b;                  /* near-black */
      --gold:#C89B3C;                /* subdued golden */
      --text:#eaeaea;                /* light text */
      --muted:#b6b6b6;
      --card:#121212;
      --radius:24px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; font-family:"Neue Haas Grotesk Text","Helvetica Neue",Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica",Arial,sans-serif; 
      background:radial-gradient(1200px 800px at 70% -10%, rgba(200,155,60,0.08), transparent), var(--bg);
      color:var(--text);
      display:grid; place-items:center;
    }
    .wrap{max-width:960px; padding:48px; text-align:center}
    .logo-img {
      width: 180px;  /* adjust as needed */
      height: auto;
      display: block;
      margin: 0 auto 20px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,.5));
    }
    h1{font-size: clamp(28px, 6vw, 48px); margin: 8px 0 6px; letter-spacing:0.4px}
    .tag{font-size:clamp(14px,2.5vw,18px); color:var(--muted); margin-bottom:26px}
    .card{
      background:var(--card); border:1px solid #1e1e1e; border-radius:var(--radius);
      padding:22px 22px; display:inline-flex; align-items:center; gap:14px
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--gold); box-shadow:0 0 16px rgba(200,155,60,.45)}
    .soon{font-weight:600; letter-spacing:.2px}
    footer{margin-top:34px; font-size:14px; color:var(--muted)}
    a{color:var(--gold); text-decoration:none}
    a:hover{text-decoration:underline}
  </style>
</head>
<body>
  <main class="wrap">
    <img src="assets/astoncyber-logo.png" alt="AstonCyber logo" class="logo-img" />
    <h1>ASTONCYBER</h1>
    <div class="tag">Modern cloud & cybersecurity solution — site launching soon.</div>
    <div class="card" role="status" aria-live="polite">
      <div class="dot" aria-hidden="true"></div>
      <div class="soon">Placeholder static app on Azure</div>
    </div>
    <footer>
      © <span id="y"></span> AstonCyber · <a href="mailto:info@astoncyber.com">info@astoncyber.com</a>
    </footer>
  </main>
  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
